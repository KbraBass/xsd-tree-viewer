name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck and bundle
        run: npm run build

      - name: Unit tests
        run: npm test

      # Packaging is part of CI because `dist/` is git-ignored: a build that
      # compiles but cannot be packaged would otherwise only fail at release.
      - name: Package
        run: npx --yes @vscode/vsce@3 package --out xsd-tree-viewer-ci.vsix

      - name: List package contents
        run: npx --yes @vscode/vsce@3 ls

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ github.sha }}
          path: xsd-tree-viewer-ci.vsix
          if-no-files-found: error

  webview:
    name: Webview keyboard checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      # playwright is not a dependency of the extension, so it is installed
      # here only, without touching the lockfile.
      - name: Install playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Keyboard navigation check
        run: npm run test:webview
